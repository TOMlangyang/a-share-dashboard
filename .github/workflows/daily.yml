name: 每日收盘数据与看板部署

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '历史回补开始日期 YYYY-MM-DD'
        required: false
        default: '2026-11-03'
        type: string
      end_date:
        description: '历史回补结束日期 YYYY-MM-DD'
        required: false
        default: '2026-11-18'
        type: string
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '40 17 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a-share-daily-pages
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 测试数据筛选逻辑
        run: python scripts/test_update_data.py
      - name: 安装可选涨停原因来源
        run: pip install levistock || echo "可选原因插件不可用，原因标记待核实"
      - name: 首次补录11月历史交易日
        if: github.event_name == 'push'
        id: backfill
        continue-on-error: true
        run: python scripts/backfill_history.py --start 2026-11-03 --end 2026-11-18 --limit 30
      - name: 手工指定历史回补范围
        if: github.event_name == 'workflow_dispatch'
        id: manual_backfill
        continue-on-error: true
        env:
          HISTORY_START: ${{ inputs.start_date }}
          HISTORY_END: ${{ inputs.end_date }}
        run: python scripts/backfill_history.py --start "$HISTORY_START" --end "$HISTORY_END" --limit 30
      - name: 标记部分历史回补失败
        if: steps.backfill.outcome == 'failure' || steps.manual_backfill.outcome == 'failure'
        run: echo "历史回补部分日期失败：已保留成功存档，未获取的日期不在网页中显示。" >> "$GITHUB_STEP_SUMMARY"
      - name: 抓取交易日涨跌停
        id: ingest
        continue-on-error: true
        run: python scripts/update_data.py
      - name: 记录行情抓取失败
        if: steps.ingest.outcome == 'failure'
        run: echo "行情更新失败，保留上一次成功快照；网页仍然部署，不伪造数据。" >> "$GITHUB_STEP_SUMMARY"
      - name: 提交行情快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh after close"
            git push
          fi
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 生成网页目录
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r data dist/data
          touch dist/.nojekyll
      - name: 上传 Pages 静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布 Pages
        id: deploy
        uses: actions/deploy-pages@v4
